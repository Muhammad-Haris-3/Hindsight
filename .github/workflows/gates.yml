name: gates

# The suite runs on every push. The gate job runs on a schedule and on demand,
# because it costs API calls and the answer only changes when a publisher
# republishes something.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, after the usual US release cadence
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Preregistration is enforced
        run: python -m pytest tests/test_preregistration.py -v
      - name: Full suite
        run: python -m pytest

  gates:
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      HINDSIGHT_FRED_API_KEY: ${{ secrets.HINDSIGHT_FRED_API_KEY }}
      HINDSIGHT_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      HINDSIGHT_WRITER_DSN: postgresql://hindsight_writer:writer@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,db]"

      - name: Migrate and apply grants
        run: python scripts/migrate.py

      - name: Append-only is enforced by the database, not by us
        # These tests skip locally without a DSN. Here the DSN is set, so a skip
        # would mean the guarantee went untested -- which is why -rs and the
        # explicit skip check below both run.
        run: |
          python -m pytest tests/test_append_only.py -v -rs | tee gate.log
          if grep -qE "skipped|no tests ran" gate.log; then
            echo "append-only tests did not run; the guarantee is untested"
            exit 1
          fi

      - name: Ingest vintages
        run: python scripts/ingest.py

      - name: Run gates
        # --source store, not auto. Gate 1 is described in the preregistration as
        # testing "our storage and our joins", which it only does if the intervals
        # came back out of Postgres. `auto` would fall back to the API if the DSN
        # were ever dropped from this job, and the verdict would look identical.
        # Here the fallback is refused instead.
        run: python scripts/run_gates.py --source store

      - name: The gate run says where it read from
        # gates.json carries `intervals_from`. If it does not say "store", the
        # storage half of Gate 1's premise went untested and the artifact must
        # not imply otherwise.
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path("artifacts/gates.json")
          if not p.exists():
              sys.exit("artifacts/gates.json was not written")
          source = json.loads(p.read_text(encoding="utf-8")).get("intervals_from")
          print(f"intervals_from: {source}")
          if source != "store":
              sys.exit(f"expected intervals_from='store', got {source!r}")
          PY
